<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miiCase AR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --orange: #F04E23;
  --teal: #93D2C3;
  --sand: #EBE2DF;
  --light-sand: #F7F2F0;
  --dark: #1A1410;
  --mid: #5C4A3D;
  --border: #D9CEC9;
  --red: #C0392B;
  --green: #27735A;
  --yellow: #D4820A;
  --teal-deep: #2A7A6A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.app-header { background: var(--dark); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 28px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.logo-mark { width: 34px; height: 34px; background: var(--orange); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 700; color: white; }
.app-title { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: white; }
.app-title span { color: var(--orange); }
.sync-status { font-size: 11px; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s; }
.sync-dot.ok { background: var(--teal); }
.sync-dot.demo { background: var(--yellow); }
.sync-dot.error { background: var(--red); }
.header-stats { margin-left: auto; display: flex; gap: 22px; }
.hstat { text-align: right; }
.hstat-num { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: white; line-height: 1; }
.hstat-label { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
.hstat-num.overdue { color: #E74C3C; }
.hstat-num.due { color: var(--orange); }
.hstat-num.ok { color: var(--teal); }

/* TABS */
.tab-bar { background: var(--dark); display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 28px; }
.tab-btn { padding: 10px 22px; background: transparent; border: none; border-bottom: 2px solid transparent; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.45); cursor: pointer; transition: all 0.15s; margin-bottom: -1px; }
.tab-btn:hover { color: rgba(255,255,255,0.75); }
.tab-btn.active { color: white; border-bottom-color: var(--orange); }
.tab-badge { display: inline-block; margin-left: 7px; min-width: 17px; padding: 1px 5px; border-radius: 9px; background: var(--orange); color: white; font-size: 10px; font-weight: 700; text-align: center; vertical-align: middle; }

/* REVIEW */
.review-reason { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.reason-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; background: rgba(212,130,10,0.15); color: var(--yellow); white-space: nowrap; }
.review-banner { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(212,130,10,0.12); border-bottom: 1px solid var(--border); font-size: 12px; color: #8a5a06; }
.review-banner strong { font-weight: 700; }
.recon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.recon-field { display: flex; flex-direction: column; gap: 4px; }
.recon-field.full { grid-column: 1 / -1; }
.recon-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mid); }
.recon-field input, .recon-field select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--dark); outline: none; background: white; }
.recon-field select { font-family: 'DM Sans', sans-serif; }
.recon-field input:focus, .recon-field select:focus { border-color: var(--orange); }
.recon-out { margin-top: 12px; padding: 11px 13px; background: var(--light-sand); border: 1px solid var(--border); border-radius: 8px; }
.recon-out .ro-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; }
.recon-out .ro-row.total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; font-weight: 700; }
.recon-out .ro-row .v { font-family: 'DM Mono', monospace; }
.recon-out .ro-row.total .v { color: var(--orange); font-size: 15px; }
.recon-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-save { flex: 1; padding: 9px; background: var(--dark); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-save:hover { background: var(--orange); }
.btn-resolve { padding: 9px 14px; background: white; color: var(--green); border: 1px solid var(--green); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-resolve:hover { background: var(--green); color: white; }
.btn-mini { padding: 5px 11px; background: white; color: var(--mid); border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 600; cursor: pointer; }
.btn-mini:hover { border-color: var(--orange); color: var(--orange); }
.btn-mini-active { background: var(--dark); color: white; border-color: var(--dark); }
.btn-mini-active:hover { color: white; border-color: var(--dark); }
.btn-mini-primary { background: var(--orange); color: white; border-color: var(--orange); }
.btn-mini-primary:hover { color: white; opacity: 0.9; }
.login-title { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--dark); margin-bottom: 14px; }
.login-input { width: 100%; box-sizing: border-box; padding: 9px 11px; margin-bottom: 9px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--dark); outline: none; }
.login-input:focus { border-color: var(--orange); }
.login-btn { width: 100%; padding: 10px; background: var(--orange); color: white; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.mm-link { color: inherit; text-decoration: none; }
.mm-link:hover .mm-tag-link { background: var(--orange); color: white; }
.mm-tag-link { display: inline-block; padding: 1px 6px; margin-left: 4px; background: rgba(217,119,66,0.12); color: var(--orange); border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; vertical-align: 2px; }
.mm-tag-link:hover { background: var(--orange); color: white; }
.search-box { padding: 5px 11px; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--dark); outline: none; width: 210px; background: white; }
.search-box:focus { border-color: var(--orange); }
.review-ok { text-align: center; padding: 50px 20px; color: var(--green); font-size: 14px; }

/* MEDICAL RECORDS */
.hipaa-line { display: flex; align-items: center; gap: 7px; font-size: 11.5px; padding: 8px 10px; border-radius: 7px; margin-bottom: 11px; }
.hipaa-ok { background: rgba(39,115,90,0.10); color: var(--green); }
.hipaa-no { background: rgba(192,57,43,0.10); color: var(--red); }
.rec-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.rec-item:first-child { border-top: none; }
.rec-label { flex: 1; font-size: 12.5px; font-weight: 500; }
.rec-label .rec-file { font-size: 10.5px; color: var(--mid); font-weight: 400; margin-top: 1px; }
.rec-status { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.rs-uploaded { background: rgba(39,115,90,0.14); color: var(--green); }
.rs-received { background: rgba(147,210,195,0.3); color: var(--teal-deep); }
.rs-requested { background: rgba(212,130,10,0.15); color: var(--yellow); }
.rs-pending, .rs-missing { background: var(--sand); color: var(--mid); }
.rs-overdue { background: rgba(192,57,43,0.14); color: var(--red); }
.rec-btn { padding: 5px 11px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); white-space: nowrap; }
.rec-download { background: var(--dark); color: white; border-color: var(--dark); }
.rec-download:hover { background: var(--orange); border-color: var(--orange); }
.rec-download:disabled { background: var(--border); color: var(--mid); border-color: var(--border); cursor: default; }
.rec-request { background: white; color: var(--orange); border-color: var(--orange); }
.rec-request:hover { background: var(--orange); color: white; }
.rec-upload { background: var(--teal-deep); color: white; border-color: var(--teal-deep); }
.rec-wait { font-size: 11px; color: var(--mid); font-style: italic; }

/* MAIN LAYOUT */
.main-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.content-panel { flex: 1; overflow: auto; background: var(--light-sand); }
.pad { padding: 22px 28px; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
.section-sub { font-size: 12px; color: var(--mid); margin-bottom: 18px; }

/* CARDS */
.card-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
.card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; color: var(--mid); }
.card-num { font-family: 'DM Mono', monospace; font-size: 25px; font-weight: 500; color: var(--dark); margin-top: 8px; line-height: 1; }
.card-num.accent { color: var(--orange); }
.card-num.good { color: var(--green); }
.card-sub { font-size: 11px; color: var(--mid); margin-top: 6px; }

/* AR AGING */
.firm-block { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.firm-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.firm-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--dark); }
.firm-total { font-family: 'DM Mono', monospace; font-size: 16px; color: var(--orange); font-weight: 500; }
.firm-count { font-size: 11px; color: var(--mid); }
.aging-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.aging-seg { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: white; min-width: 0; overflow: hidden; white-space: nowrap; transition: flex-grow 0.4s; }
.aging-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mid); }
.legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.legend-val { font-family: 'DM Mono', monospace; color: var(--dark); }
.seg-0-30   { background: var(--teal-deep); }
.seg-31-60  { background: var(--teal); color: var(--dark); }
.seg-61-90  { background: var(--yellow); }
.seg-91-180 { background: var(--orange); }
.seg-180    { background: var(--red); }

/* TABLE */
.table-wrap { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.ar-table { width: 100%; border-collapse: collapse; }
.ar-table thead th { background: var(--sand); padding: 10px 16px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mid); white-space: nowrap; }
.ar-table td { padding: 12px 16px; font-size: 12.5px; color: var(--dark); border-top: 1px solid var(--border); vertical-align: middle; }
.ar-table tbody tr { cursor: pointer; transition: background 0.12s; }
.ar-table tbody tr:hover { background: var(--light-sand); }
.ar-table tbody tr.selected { background: var(--light-sand); box-shadow: inset 3px 0 0 var(--orange); }
.num { font-family: 'DM Mono', monospace; }
.name-primary { font-weight: 600; font-size: 13px; }
.name-sub { font-size: 11px; color: var(--mid); margin-top: 1px; }
.right { text-align: right; }

/* BADGES */
.badge { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
.pri-urgent { background: rgba(192,57,43,0.14); color: var(--red); }
.pri-high   { background: rgba(240,78,35,0.13); color: var(--orange); }
.pri-normal { background: rgba(147,210,195,0.28); color: var(--teal-deep); }
.pri-low    { background: var(--sand); color: var(--mid); }
.pri-hold   { background: #eee; color: #999; }
.status-badge { background: var(--sand); color: var(--mid); }
.days-warn { color: var(--red); font-weight: 600; }
.days-ok { color: var(--mid); }

/* SCORE PIP */
.score { display: inline-flex; align-items: center; gap: 7px; }
.score-track { width: 46px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.score-fill { height: 100%; background: var(--orange); border-radius: 3px; }

/* DETAIL PANEL */
.detail-panel { width: 400px; flex-shrink: 0; background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.detail-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--mid); padding: 40px; text-align: center; }
.detail-empty .empty-icon { font-size: 30px; opacity: 0.3; }
.detail-empty p { font-size: 13px; opacity: 0.65; line-height: 1.5; }
.detail-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); background: var(--light-sand); }
.detail-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--dark); margin: 2px 0; }
.detail-meta { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.dm-row { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.dml { color: var(--mid); min-width: 66px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.dmv { color: var(--dark); }
.detail-section { padding: 15px 20px; border-bottom: 1px solid var(--border); }
.sec-hdr { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--mid); margin-bottom: 12px; }

/* DEMAND MATH */
.math-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12.5px; }
.math-row .lbl { color: var(--mid); }
.math-row .val { font-family: 'DM Mono', monospace; color: var(--dark); }
.math-row.deduct .val { color: var(--red); }
.math-row.subtotal { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 9px; font-weight: 600; }
.math-row.subtotal .lbl { color: var(--dark); font-weight: 600; }
.math-row.total { border-top: 2px solid var(--dark); margin-top: 6px; padding-top: 10px; }
.math-row.total .lbl { color: var(--dark); font-weight: 700; font-size: 13px; }
.math-row.total .val { color: var(--orange); font-weight: 600; font-size: 15px; }

/* BILLS MINI TABLE */
.bill-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); font-size: 12px; gap: 8px; }
.bill-item:first-child { border-top: none; }
.bill-desc { font-weight: 500; }
.bill-prov { font-size: 10.5px; color: var(--mid); margin-top: 1px; }
.bill-amt { font-family: 'DM Mono', monospace; text-align: right; white-space: nowrap; }
.mii-tag { display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; background: rgba(240,78,35,0.13); color: var(--orange); border-radius: 4px; padding: 1px 5px; margin-left: 5px; }

/* EMAIL DRAFT */
.draft-btn { padding: 7px 14px; background: var(--orange); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
.draft-select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 11.5px; color: var(--dark); background: white; max-width: 200px; }
.draft-btn:hover { opacity: 0.9; }
.draft-btn:disabled { background: var(--border); color: var(--mid); cursor: default; }
.email-subject { font-size: 11.5px; font-weight: 600; color: var(--orange); margin-bottom: 8px; padding: 7px 10px; background: var(--light-sand); border-radius: 5px; border-left: 3px solid var(--orange); }
.email-subject span { font-weight: 400; color: var(--mid); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 2px; }
.email-body { font-size: 12px; color: var(--dark); line-height: 1.65; white-space: pre-wrap; background: var(--light-sand); border: 1px solid var(--border); border-radius: 7px; padding: 11px 13px; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--mid); font-size: 14px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; }

/* AUTH */
.signout-btn { margin-left: 14px; padding: 5px 12px; background: transparent; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; }
.signout-btn:hover { border-color: var(--orange); color: white; }
.login-overlay { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 400; padding: 24px; }
.login-overlay.hidden { display: none; }
.login-card { width: 340px; max-width: 94vw; background: white; border-radius: 14px; padding: 30px 30px 26px; box-shadow: 0 24px 70px rgba(0,0,0,0.45); }
.login-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; }
.login-brand .logo-mark { width: 30px; height: 30px; font-size: 15px; }
.login-brand .t { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--dark); }
.login-brand .t span { color: var(--orange); }
.login-sub { font-size: 12px; color: var(--mid); margin-bottom: 20px; }
.login-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.login-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid); }
.login-field input { padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--dark); outline: none; }
.login-field input:focus { border-color: var(--orange); }
.login-signin { width: 100%; padding: 10px; background: var(--orange); color: white; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.login-signin:hover { opacity: 0.92; }
.login-alt { width: 100%; padding: 9px; background: transparent; color: var(--mid); border: none; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; margin-top: 8px; text-decoration: underline; }
.login-err { font-size: 12px; color: var(--red); min-height: 16px; margin-top: 10px; line-height: 1.4; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo-mark">m</div>
  <div class="app-title">mii<span>Case</span> AR</div>
  <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Loading…</span></div>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-num accent" id="stat-outstanding">$0</div><div class="hstat-label">Outstanding</div></div>
    <div class="hstat"><div class="hstat-num" id="stat-cases">0</div><div class="hstat-label">Open Cases</div></div>
    <div class="hstat"><div class="hstat-num due" id="stat-due">0</div><div class="hstat-label">Due Follow-up</div></div>
    <div class="hstat"><div class="hstat-num overdue" id="stat-overdue">0</div><div class="hstat-label">Overdue</div></div>
  </div>
  <button class="signout-btn" id="signout-btn" style="display:none" onclick="signOut()">Sign out</button>
</div>

<div class="login-overlay hidden" id="login-overlay">
  <div class="login-card">
    <div class="login-brand"><div class="logo-mark">m</div><div class="t">mii<span>Case</span> AR</div></div>
    <div class="login-sub">Sign in to your firm's accounts-receivable workspace.</div>
    <div class="login-field"><label>Email</label><input type="email" id="login-email" placeholder="you@firm.com" autocomplete="username"></div>
    <div class="login-field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()"></div>
    <button class="login-signin" onclick="signIn()">Sign in</button>
    <button class="login-alt" onclick="sendReset()">Forgot your password?</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">AR Dashboard</button>
  <button class="tab-btn" data-tab="cases" onclick="switchTab('cases')">Cases</button>
  <button class="tab-btn" data-tab="autopilot" onclick="switchTab('autopilot')">Autopilot Queue</button>
  <button class="tab-btn" data-tab="review" onclick="switchTab('review')">Needs Review<span class="tab-badge" id="review-badge" style="display:none">0</span></button>

// ---- Formatting helpers ------------------------------------
const fmt = (n) => "$" + Math.round(n || 0).toLocaleString();
const fmtK = (n) => { n = n || 0; return n >= 1000 ? "$" + (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : "$" + Math.round(n); };
const PRIORITY_WEIGHT = { urgent: 100, high: 60, normal: 30, low: 10, hold: 0 };

// ---- Date helpers ------------------------------------------
const daysAgo = (ts) => (ts ? Math.floor((Date.now() - new Date(ts).getTime()) / 86_400_000) : null);
const signedDays = (ts) => (ts == null ? null : Math.floor((new Date(ts).getTime() - Date.now()) / 86_400_000));

// ---- Shared derivation: bills → totals, balance, priority score ----
// `base` carries the raw fields; both the demo mapper and the live case
// mapper feed the same shape here so the numbers stay identical to the SQL.
// Outstanding lien on a bill = charges still owed after PIP + insurance
// (migration 0008). A `lien_manual` bill keeps its stored figure (negotiated).
const billLien = (x) => (x.lien_manual ? (x.lien ?? 0) : Math.max(0, (x.billed || 0) - (x.pip_paid || 0) - (x.ins_paid || 0)));

function deriveCase(base) {
  const b = base.bills;
  const totalBilled = b.reduce((s, x) => s + x.billed, 0);
  const pipPaid = b.reduce((s, x) => s + x.pip_paid, 0);
  const insPaid = b.reduce((s, x) => s + x.ins_paid, 0);
  const totalLien = b.reduce((s, x) => s + billLien(x), 0);          // derived outstanding
  const collected = b.reduce((s, x) => s + x.collected, 0);
  const miispineLien = b.filter((x) => x.mii).reduce((s, x) => s + billLien(x), 0);
  const otherLiens = totalLien - miispineLien;
  const balance = Math.max(0, totalLien - collected);
  const collateral = pipPaid + insPaid;
  const netSpecials = totalBilled - collateral;

  // Same priority formula as the autopilot_queue view.
  const ageForScore = Math.min(base.last_outreach_days ?? base.opened_days, 60);
  const balanceFactor = balance > 50000 ? 30 : balance > 20000 ? 15 : 0;
  const score = (PRIORITY_WEIGHT[base.priority] || 0) + ageForScore + balanceFactor;

  return {
    ...base,
    reviewStatus: base.review?.status || base.reviewStatus || "ok",
    reviewReason: base.review?.reason || base.reviewReason || null,
    hipaa: base.hipaa !== false,
    records: base.records || [],
    totalBilled, pipPaid, insPaid, totalLien, collected,
    miispineLien, otherLiens, balance, collateral, netSpecials, score,
    dueForFollowup: base.next_followup_days !== null && base.next_followup_days <= 0 && base.priority !== "hold" && !["closed", "settled"].includes(base.status),
    overdue: base.next_followup_days !== null && base.next_followup_days <= -7,
  };
}

}

// Supabase one-to-one embeds come back as an object; one-to-many as an array.
const firstOf = (v) => (Array.isArray(v) ? v[0] : v) || null;

// Live mapper: a `cases` row with embedded firm/attorney/client/pip/bills/milestones.
function mapCaseRow(row) {
  const atty = firstOf(row.attorney) || {};
  const firm = firstOf(row.firm) || {};
  const client = firstOf(row.client) || {};
  const pipRow = firstOf(row.pip_ledger);
  const bills = (row.medical_bills || []).map((b) => {
    const prov = firstOf(b.provider) || {};
    return {
      id: b.id, desc: b.description || "", prov: prov.name || "", mii: !!prov.is_miispine,
      billed: +b.billed_amount || 0, pip_paid: +b.pip_paid || 0, ins_paid: +b.insurance_paid || 0,
      lien: +b.lien_amount || 0, lien_manual: !!b.lien_manual, collected: +b.collected_amount || 0,
    };
  });
  const ms = (row.milestones || [])
    .filter((m) => m.actual_date)
    .sort((a, b) => new Date(b.actual_date) - new Date(a.actual_date))[0];
  const lastInitial = client.last_name ? client.last_name.charAt(0) + "." : "";

  return deriveCase({
    id: row.id,
    firm: firm.id || row.firm_id,
    patient: `${client.first_name || ""} ${lastInitial}`.trim() || "Unknown",
    claim: row.claim_number || "",
    status: row.status,
    opened_days: daysAgo(row.opened_at) ?? 0,
    priority: row.followup_priority,
    last_outreach_days: daysAgo(row.last_outreach_at),
    next_followup_days: signedDays(row.next_followup_at),
    pip: pipRow ? { status: pipRow.status || "unknown", remaining: +pipRow.balance_remaining || 0 } : { status: "unknown", remaining: 0 },
    milestone: ms ? { type: ms.milestone_type, days: daysAgo(ms.actual_date) } : null,
    bills,
    firmName: firm.name || "",
    atty: { name: atty.name || "Counsel", email: atty.email, avg_response_days: atty.avg_response_days, preferred_contact: atty.preferred_contact || "email" },
    reviewStatus: row.review_status || "ok",
    reviewReason: row.review_reason || null,
    carrier: row.liability_carrier || "",
    healthIns: row.health_insurance || "",
    assignedTo: row.assigned_to || "",
    emrPatientId: row.emr_patient_id || null,
    pmBalance: row.emr_pm_balance == null ? null : +row.emr_pm_balance,
    hipaa: !!client.hipaa_release_on_file,
    records: (row.records || []).map((r) => ({
      id: r.id, type: r.record_type, status: r.status, filename: r.filename, file: !!(r.has_file || r.storage_key),
    })),
  });
}

let fbAuth = null, fbUser = null, idToken = null;
async function getAuth() {
  if (fbAuth) return fbAuth;
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  fbAuth = authMod.getAuth(appMod.initializeApp(FIREBASE_CONFIG));
  fbAuth._mod = authMod;
  return fbAuth;
}
// Authenticated fetch to the Cloud Run API tier.
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (idToken) headers.Authorization = "Bearer " + idToken;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (!res.ok) { let m; try { m = (await res.json()).error; } catch (e) {} throw new Error(m || ("HTTP " + res.status)); }
  return res.status === 204 ? null : res.json();
}
const showLogin = () => document.getElementById("login-overlay").classList.remove("hidden");
const hideLogin = () => document.getElementById("login-overlay").classList.add("hidden");
const setSignoutVisible = (v) => (document.getElementById("signout-btn").style.display = v ? "" : "none");

async function loadData() {
  const dot = document.getElementById("sync-dot");
  const label = document.getElementById("sync-label");

  // No API/Firebase configured → embedded demo dataset, no login.
  if (!CONFIGURED()) {
    LIVE = false; AR_AGING = null; QUEUE = null; CASES = buildMockCases(); INVOICES = buildMockInvoices();
    hideLogin(); setSignoutVisible(false);
    dot.className = "sync-dot demo"; label.textContent = "Demo data";
    renderHeaderStats(); render();
    return;
  }

  let auth;
  try { auth = await getAuth(); }
  catch (e) {
    console.error("firebase init failed:", e);
    LIVE = false; CASES = buildMockCases();
    dot.className = "sync-dot error"; label.textContent = "Connection failed — demo data";
    renderHeaderStats(); render();
    return;
  }

  // Require a signed-in Firebase user — the API sets app.firm_id from it.
  fbUser = auth.currentUser;
  if (!fbUser) {
    setSignoutVisible(false);
    dot.className = "sync-dot demo"; label.textContent = "Sign in required";
    showLogin();
    return;
  }
  hideLogin(); setSignoutVisible(true);

  try {
    idToken = await fbUser.getIdToken();
    // One bundle: cases (nested) + views + invoices + profile. RLS scopes it.
    const d = await api("/api/dashboard");
    IS_STAFF = !!(d.me && d.me.isStaff);
    CASES = (d.cases || []).map(mapCaseRow);
    AR_AGING = d.ar_aging || null;
    QUEUE = d.autopilot_queue || null;
    INVOICES = (d.invoices || []).map(mapInvoiceApi);
    LIVE = true;

    dot.className = "sync-dot ok";
    label.textContent = CASES.length
      ? `Live · ${CASES.length} cases`
      : "Live · no cases for this firm";
  } catch (e) {
    console.error("live load failed:", e);
    LIVE = false; AR_AGING = null; QUEUE = null; CASES = buildMockCases();
    dot.className = "sync-dot error"; label.textContent = "Load failed — demo data";
  }
  renderHeaderStats();
  render();
}

// ---- Auth handlers -----------------------------------------
window.signIn = async () => {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  err.style.color = "var(--red)"; err.textContent = "";
  if (!email || !password) { err.textContent = "Enter your email and password."; return; }
  try {
    const auth = await getAuth();
    await auth._mod.signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged (wired at bootstrap) fires → loadData().
  } catch (e) { err.textContent = (e && e.message) || "Sign-in failed."; }
};

window.sendReset = async () => {
  const email = document.getElementById("login-email").value.trim();
  const err = document.getElementById("login-err");
  if (!email) { err.style.color = "var(--red)"; err.textContent = "Enter your email first."; return; }
  try {
    const auth = await getAuth();
    await auth._mod.sendPasswordResetEmail(auth, email);
    err.style.color = "var(--green)"; err.textContent = "Password reset email sent — check your inbox.";
  } catch (e) { err.style.color = "var(--red)"; err.textContent = (e && e.message) || "Could not send email."; }
};

window.signOut = async () => {
  try { if (fbAuth) await fbAuth._mod.signOut(fbAuth); } catch (e) { /* ignore */ }
  location.reload();
};

function reviewCases() {
  return CASES.filter((c) => c.reviewStatus === "needs_review");

function renderHeaderStats() {
  const open = CASES.filter((c) => !["closed", "settled"].includes(c.status));
  const outstanding = open.reduce((s, c) => s + c.balance, 0);
  document.getElementById("stat-outstanding").textContent = fmtK(outstanding);
  document.getElementById("stat-cases").textContent = open.length;
  document.getElementById("stat-due").textContent = CASES.filter((c) => c.dueForFollowup).length;
  document.getElementById("stat-overdue").textContent = CASES.filter((c) => c.overdue).length;
  const rc = reviewCases().length;
  const badge = document.getElementById("review-badge");
  badge.textContent = rc;
  badge.style.display = rc ? "" : "none";
  const overdue = INVOICES.filter((i) => i.status === "overdue").length;
  const ib = document.getElementById("invoice-badge");
  ib.textContent = overdue;
  ib.style.display = overdue ? "" : "none";
}

  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  render();
};

function render() {
  const el = document.getElementById("tab-content");
  if (activeTab === "dashboard") el.innerHTML = renderDashboard();
  else if (activeTab === "cases") el.innerHTML = renderCases();
  else if (activeTab === "autopilot") el.innerHTML = renderAutopilot();
  else if (activeTab === "review") el.innerHTML = renderReview();
  else if (activeTab === "invoices") el.innerHTML = renderInvoices();
  // reselect highlight
  document.querySelectorAll("tr[data-case]").forEach((r) => r.classList.toggle("selected", r.dataset.case === selectedId));
  document.querySelectorAll("tr[data-inv]").forEach((r) => r.classList.toggle("selected", r.dataset.inv === selectedInvoice));
}

// ---- Dashboard: AR aging by firm ---------------------------
function renderDashboard() {
  const open = CASES.filter((c) => c.status !== "closed");
  const totalCollected = CASES.reduce((s, c) => s + c.collected, 0);
  const miiOut = open.reduce((s, c) => s + Math.max(0, c.miispineLien), 0);
  const miiCount = open.filter((c) => c.miispineLien > 0).length;

  const bucketDefs = [
    { key: "b1", label: "0–30", cls: "seg-0-30", test: (d) => d <= 30 },
    { key: "b2", label: "31–60", cls: "seg-31-60", test: (d) => d > 30 && d <= 60 },
    { key: "b3", label: "61–90", cls: "seg-61-90", test: (d) => d > 60 && d <= 90 },
    { key: "b4", label: "91–180", cls: "seg-91-180", test: (d) => d > 90 && d <= 180 },
    { key: "b5", label: "180+", cls: "seg-180", test: (d) => d > 180 },
  ];

  // Firm aging: straight from the ar_aging view when live, else computed from CASES.
  let firmList;
  if (LIVE && AR_AGING) {
    firmList = AR_AGING.map((r) => ({
      name: r.firm,
      count: Number(r.case_count) || 0,
      total: Number(r.total_outstanding) || 0,
      buckets: {
        b1: Number(r.bucket_0_30) || 0, b2: Number(r.bucket_31_60) || 0,
        b3: Number(r.bucket_61_90) || 0, b4: Number(r.bucket_91_180) || 0,
        b5: Number(r.bucket_180_plus) || 0,
      },
    })).sort((a, b) => b.total - a.total);
  } else {
    const firms = {};
    for (const c of open) {
      const f = (firms[c.firm] ||= { name: c.firmName, count: 0, total: 0, buckets: { b1: 0, b2: 0, b3: 0, b4: 0, b5: 0 } });
      f.count++; f.total += c.balance;
      const bd = bucketDefs.find((b) => b.test(c.opened_days));
      if (bd) f.buckets[bd.key] += c.balance;
    }
    firmList = Object.values(firms).sort((a, b) => b.total - a.total);
  }
  const totalOut = firmList.reduce((s, f) => s + f.total, 0);
  const openCount = firmList.reduce((s, f) => s + f.count, 0);

  const cards = `
    <div class="card-row">
      <div class="card"><div class="card-label">Total Outstanding</div><div class="card-num accent">${fmt(totalOut)}</div><div class="card-sub">${openCount} open cases</div></div>
      <div class="card"><div class="card-label">miiSpine Liens</div><div class="card-num">${fmt(miiOut)}</div><div class="card-sub">across ${miiCount} cases</div></div>
      <div class="card"><div class="card-label">Collected YTD</div><div class="card-num good">${fmt(totalCollected)}</div><div class="card-sub">recovered to date</div></div>
      <div class="card"><div class="card-label">Overdue Follow-ups</div><div class="card-num accent">${CASES.filter((c)=>c.overdue).length}</div><div class="card-sub">7+ days past due</div></div>
    </div>`;

  const blocks = firmList.map((f) => {
    const segs = bucketDefs.map((b) => {
      const v = f.buckets[b.key];
      if (v <= 0) return "";
      const pct = (v / f.total) * 100;
      return `<div class="aging-seg ${b.cls}" style="flex-grow:${v}" title="${b.label} days: ${fmt(v)}">${pct > 9 ? fmtK(v) : ""}</div>`;
    }).join("");
    const legend = bucketDefs.map((b) =>
      `<div class="legend-item"><div class="legend-swatch ${b.cls}"></div>${b.label}d <span class="legend-val">${fmt(f.buckets[b.key])}</span></div>`
    ).join("");
    return `
      <div class="firm-block">
        <div class="firm-head">
          <div><div class="firm-name">${f.name}</div><div class="firm-count">${f.count} cases</div></div>
          <div class="firm-total">${fmt(f.total)}</div>
        </div>
        <div class="aging-bar">${segs || '<div class="aging-seg seg-0-30" style="flex-grow:1"></div>'}</div>
        <div class="aging-legend">${legend}</div>
      </div>`;
  }).join("");

  return `<div class="section-title">Accounts Receivable Aging</div>
    <div class="section-sub">Outstanding lien balances bucketed by case age, per firm.</div>
    ${cards}${blocks}`;
}

function renderAutopilot() {
  // From the autopilot_queue view when live (server-computed score + ordering),
  // else computed from CASES with the same formula.
  let queue;
  if (LIVE && QUEUE) {
    queue = QUEUE.map((r) => ({
      id: r.id, patient: r.patient_name || "Unknown", firmName: r.firm_name || "",
      attyName: r.attorney_name || "Counsel", preferred: r.preferred_contact || "email",
      balance: Number(r.balance_outstanding) || 0,
      last_outreach_days: r.days_since_outreach === null ? null : Number(r.days_since_outreach),
      priority: r.followup_priority, score: Number(r.priority_score) || 0,
    }));
  } else {
    queue = CASES
      .filter((c) => !["closed", "settled"].includes(c.status) && c.priority !== "hold" && (c.next_followup_days === null || c.next_followup_days <= 0))
      .sort((a, b) => b.score - a.score)
      .map((c) => ({
        id: c.id, patient: c.patient, firmName: c.firmName, attyName: c.atty.name,
        preferred: c.atty.preferred_contact, balance: c.balance,
        last_outreach_days: c.last_outreach_days, priority: c.priority, score: c.score,
      }));
  }
  const maxScore = Math.max(...queue.map((c) => c.score), 1);

  if (!queue.length) return `<div class="section-title">Autopilot Queue</div><div class="empty-state">No cases due for follow-up. 🎉</div>`;

  const rows = queue.map((c) => {
    const days = c.last_outreach_days;
    const daysCell = days === null ? '<span class="days-ok">first contact</span>'
      : `<span class="${days >= 14 ? "days-warn" : "days-ok"}">${days}d ago</span>`;
    return `
    <tr data-case="${c.id}" onclick="selectCase('${c.id}')">
      <td><span class="score"><span class="num" style="width:26px;display:inline-block">${c.score}</span><span class="score-track"><span class="score-fill" style="width:${(c.score / maxScore) * 100}%"></span></span></span></td>
      <td><div class="name-primary">${c.patient}</div><div class="name-sub">${c.firmName}</div></td>
      <td>${c.attyName}<div class="name-sub">${c.preferred}</div></td>
      <td class="right num">${fmt(c.balance)}</td>
      <td>${daysCell}</td>
      <td><span class="badge pri-${c.priority}">${c.priority}</span></td>
    </tr>`;
  }).join("");

  return `<div class="section-title">Autopilot Queue</div>
    <div class="section-sub">Cases scored for tonight's outreach run, highest priority first — the same score the nightly edge function uses.</div>
    <div class="table-wrap"><table class="ar-table">
      <thead><tr><th>Score</th><th>Patient</th><th>Attorney</th><th class="right">Balance</th><th>Last Outreach</th><th>Priority</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

// Invoices — miiSpine collections invoices to the firm
// ============================================================
const INVOICE_SELECT = `
  id, invoice_no, case_id, firm_id, amount, amount_paid, balance_due, status, issue_date, due_date, paid_date, memo,
  case:cases(claim_number, client:clients(first_name, last_name)),
  firm:firms(name),
  invoice_payments(amount, paid_on, method, note)
`;
const INV_ORDER = { overdue: 0, partial: 1, sent: 2, draft: 3, paid: 4, void: 5 };
const INV_STATUS_CLS = { draft: "rs-pending", sent: "rs-received", partial: "rs-requested", paid: "rs-uploaded", overdue: "rs-overdue", void: "rs-missing" };

function effInvStatus(raw, amount, paid, dueStr) {
  if (raw === "void") return "void";
  if (amount > 0 && paid >= amount) return "paid";
  const today = new Date(new Date().toDateString());
  if (dueStr && new Date(dueStr) < today && amount - paid > 0 && (raw === "sent" || raw === "partial")) return "overdue";
  if (paid > 0) return "partial";
  return raw;
}

function buildMockInvoices() {
  return (MOCK.invoices || []).map((iv) => {
    const c = CASES.find((x) => x.id === iv.case_id);
    const paid = (iv.payments || []).reduce((s, p) => s + p.amount, 0);
    const due = isoDays(iv.due_days);
    const raw = paid <= 0 ? "sent" : paid >= iv.amount ? "paid" : "partial";
    return {
      id: iv.id, no: iv.no, case_id: iv.case_id, firm: c ? c.firm : null,
      patient: c ? c.patient : "—", firmName: c ? c.firmName : "—",
      amount: iv.amount, amount_paid: paid, balance_due: Math.max(0, iv.amount - paid),
      status: effInvStatus(raw, iv.amount, paid, due),
      issue_date: isoDays(-iv.issue_days), due_date: due, memo: iv.memo,
      payments: (iv.payments || []).map((p) => ({ amount: p.amount, paid_on: isoDays(-p.paid_days), method: p.method })),
    };
  });
}

// The API returns flat invoices_view rows (effective_status already computes
// overdue; firm/patient names are joined in).
function mapInvoiceApi(row) {
  const amount = +row.amount || 0, paid = +row.amount_paid || 0;
  return {
    id: row.id, no: row.invoice_no, case_id: row.case_id, firm: row.firm_id,
    patient: row.patient_name || "—", firmName: row.firm_name || "—",
    amount, amount_paid: paid,
    balance_due: row.balance_due != null ? +row.balance_due : Math.max(0, amount - paid),
    status: row.effective_status || row.status,
    issue_date: row.issue_date, due_date: row.due_date, memo: row.memo,
    payments: [],   // payment history is not in the list view
  };
}

  if (LIVE) {

    <div class="card"><div class="card-label">Collected</div><div class="card-num good">${fmt(collected)}</div><div class="card-sub">received to date</div></div>

  if (!list.length) {
    return `<div class="section-title">Invoices</div>
      <div class="section-sub">Collections invoices issued to firms for outstanding liens.</div>${cards}
      <div class="empty-state">No invoices yet — open a case and use <strong>Issue invoice</strong>${IS_STAFF || !LIVE ? "" : " (staff only)"}.</div>`;
  }
  const rows = list.map((i) => `
    <tr data-inv="${i.id}" onclick="selectInvoice('${i.id}')">
      <td><div class="name-primary">${i.no || "—"}</div><div class="name-sub">${i.issue_date || ""}</div></td>

window.issueInvoice = async (caseId) => {
  const c = CASES.find((x) => x.id === caseId);
  if (!c) return;
  const amount = Math.round(c.balance * 100) / 100;
  if (amount <= 0) { toast("No outstanding balance to invoice"); return; }
  const memo = `Outstanding miiSpine lien — ${c.patient}`;
  if (LIVE) {
    try {
      await api("/api/invoices", { method: "POST", body: JSON.stringify({ case_id: caseId, firm_id: c.firm, amount, memo, due_days: 30 }) });
      await refreshInvoices(); renderDetail(); toast("Invoice issued");
    } catch (e) { toast("Issue failed: " + (e.message || e)); }
    return;
  }
  const n = (MOCK.invoices.length + 1).toString().padStart(4, "0");
  MOCK.invoices.push({ id: "inv" + Date.now(), no: "MII-2026-" + n, case_id: caseId, amount, issue_days: 0, due_days: 30, memo, payments: [] });
  INVOICES = buildMockInvoices(); renderHeaderStats(); renderDetail(); toast("Invoice issued (demo)");
};

window.recordPayment = async (invId) => {
  const inv = INVOICES.find((x) => x.id === invId);
  const amount = +document.getElementById("pay-amount").value || 0;
  const method = document.getElementById("pay-method").value;

  if (LIVE) {
    try {
      await api(`/api/invoices/${invId}/payments`, { method: "POST", body: JSON.stringify({ amount, method }) });
      await refreshInvoices(); toast("Payment recorded");
    } catch (e) { toast("Payment failed: " + (e.message || e)); }
    return;
  }
  const mi = MOCK.invoices.find((x) => x.id === invId);

};

window.voidInvoice = async (invId) => {

// Accepts a bare ModMed patient id or a full chart URL and extracts the id
// (the numeric segment after "/patient/" — matches the {id} in MM_CHART_URL).
function extractEmrPatientId(raw) {
  const s = (raw || "").trim();
  if (!s) return null;
  const m = s.match(/\/patient\/(\d+)/i);
  if (m) return m[1];
  return /^\d+$/.test(s) ? s : s;  // fall back to whatever was typed
}

window.saveCaseDetails = async (id) => {
  const v = (x) => document.getElementById(x).value.trim() || null;
  const body = { claim_number: v("ed-claim"), liability_carrier: v("ed-carrier"),
                 health_insurance: v("ed-hins"), assigned_to: v("ed-assigned"),
                 emr_patient_id: extractEmrPatientId(v("ed-emr")) };
  if (LIVE) {
    try { await api(`/api/cases/${id}`, { method: "PATCH", body: JSON.stringify(body) });
      await loadData(); selectCase(id); toast("Case updated");
    } catch (e) { toast("Save failed: " + (e.message || e)); }
    return;
  }
  const mc = MOCK.cases.find((x) => x.id === id);
  if (mc) mc.claim = body.claim_number || mc.claim;
  CASES = buildMockCases(); renderDetail(); toast("Saved (demo)");
};

window.setCaseStatus = async (id, status) => {
  if (LIVE) {
    try { await api(`/api/cases/${id}`, { method: "PATCH", body: JSON.stringify({ status }) });
      await loadData(); selectCase(id);
      toast(status === "settled" ? "Case settled — moved out of the worklist" : "Case reopened");
    } catch (e) { toast("Failed: " + (e.message || e)); }
    return;
  }
  const mc = MOCK.cases.find((x) => x.id === id);
  if (mc) mc.status = status;
  CASES = buildMockCases(); renderHeaderStats(); render(); renderDetail(); toast("Saved (demo)");
};

// Live preview of the reconciliation math as staff type.
window.reconPreview = () => {
  if (!reconCtx) return;
  const billed = +document.getElementById("recon-billed").value || 0;
  const pip = +document.getElementById("recon-pip").value || 0;
  const ins = +document.getElementById("recon-ins").value || 0;
  const col = +document.getElementById("recon-col").value || 0;
  const tbLien = Math.max(0, billed - pip - ins);
  const totalLien = tbLien + reconCtx.otherLien;
  const balance = Math.max(0, totalLien - (col + reconCtx.otherCollected));
  document.getElementById("ro-lien").textContent = fmt(tbLien);
  document.getElementById("ro-balance").textContent = fmt(balance);
};

// Persist reconciliation: mutate the miiSpine bill + case status.
window.saveReconcile = async () => {
  if (!reconCtx) return;
  const tb = reconCtx.tb;
  const billed = +document.getElementById("recon-billed").value || 0;
  const pip = +document.getElementById("recon-pip").value || 0;
  const ins = +document.getElementById("recon-ins").value || 0;
  const col = +document.getElementById("recon-col").value || 0;
  const status = document.getElementById("recon-status").value;

  if (LIVE) {
    try {
      if (tb.id) {
        await api(`/api/bills/${tb.id}`, { method: "PATCH", body: JSON.stringify({ billed_amount: billed, pip_paid: pip, insurance_paid: ins, collected_amount: col }) });
      }
      await api(`/api/cases/${reconCtx.caseId}`, { method: "PATCH", body: JSON.stringify({ status }) });
      await loadData();
      selectCase(reconCtx.caseId);
      toast("Reconciliation saved");
    } catch (e) { toast("Save failed: " + (e.message || e)); }
    return;
  }
  // Demo: mutate the underlying bill + status, re-derive.
  tb.billed = billed; tb.pip_paid = pip; tb.ins_paid = ins; tb.collected = col;
  const mc = MOCK.cases.find((x) => x.id === reconCtx.caseId);
  if (mc) mc.status = status;
  CASES = buildMockCases();
  renderHeaderStats(); render(); renderDetail();
  toast("Reconciliation saved (demo)");
};

// Clear the review flag once a case is fixed.
window.resolveReview = async () => {
  if (!reconCtx) return;
  const id = reconCtx.caseId;
  if (LIVE) {
    try {
      await api(`/api/cases/${id}`, { method: "PATCH", body: JSON.stringify({ review_status: "resolved" }) });
      await loadData(); selectCase(id); toast("Marked resolved");
    } catch (e) { toast("Failed: " + (e.message || e)); }
    return;
  }
  const mc = MOCK.cases.find((x) => x.id === id);
  if (mc) mc.review = { status: "resolved", reason: null };
  CASES = buildMockCases();
  renderHeaderStats(); if (activeTab === "review") render(); renderDetail();
  toast("Marked resolved (demo)");
};

// Small toast helper.
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// Letter generator — templated client-side from the case's live numbers.
// (The nightly autopilot's outbound email is separate and uses Claude.)
const LETTERS = {
  status(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · miiSpine balance ${fmt(c.balance)}`,
      body:
`Dear ${v.attyFirst},

I'm following up on ${c.patient} (claim ${c.claim}) ${v.milestone}. miiSpine currently has an outstanding lien balance of ${fmt(c.balance)} on this matter, with PIP ${c.pip.status}.

Could you share the current status of the case and any expected timeline for resolution? We're glad to provide updated records or an itemized statement to keep things moving.

Thank you,
miiSpine Billing`,
    };
  },
  records_cover(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · Records & itemized statement enclosed`,
      body:
`Dear ${v.attyFirst},

Enclosed please find the medical records and an itemized statement of charges for ${c.patient} (claim ${c.claim}), treated at miiSpine.

Charges to date total ${fmt(c.totalBilled)}, with ${fmt(v.paid)} paid (PIP and health insurance combined), leaving an outstanding balance of ${fmt(c.balance)}.

Please confirm receipt, and let us know if you need anything further to support your demand — updated records, a narrative report, or a current statement are available on request.

Sincerely,
miiSpine Billing`,
    };
  },
  lop_request(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · Letter of protection requested`,
      body:
`Dear ${v.attyFirst},

miiSpine is providing ongoing care to your client ${c.patient} (claim ${c.claim}). PIP benefits on this matter are ${c.pip.status}${c.pip.remaining ? ` with approximately ${fmt(c.pip.remaining)} remaining` : ""}, and the current outstanding balance is ${fmt(c.balance)}.

So that treatment can continue without interruption, we ask that your office issue a letter of protection guaranteeing payment of miiSpine's charges from the proceeds of any settlement or judgment in this matter.

A current itemized statement is available on request. Please return the signed letter of protection at your earliest convenience.

Sincerely,
miiSpine Billing`,
    };
  },
  lien_notice(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · Notice of provider lien — ${fmt(c.balance)}`,
      body:
`Dear ${v.attyFirst},

This letter serves as formal notice that miiSpine holds a lien for medical services provided to ${c.patient} in connection with claim ${c.claim}${c.carrier ? ` (liability carrier: ${c.carrier})` : ""}.

Charges to date total ${fmt(c.totalBilled)}; after payments of ${fmt(v.paid)}, the outstanding lien balance is ${fmt(c.balance)}.

Please honor this lien from the proceeds of any settlement or judgment, and include miiSpine on the settlement draft or arrange payment at disbursement. Kindly acknowledge receipt of this notice.

Sincerely,
miiSpine Billing`,
    };
  },
  settlement_demand(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · Payment demand — lien balance ${fmt(c.balance)}`,
      body:
`Dear ${v.attyFirst},

It is our understanding that the claim for ${c.patient} (claim ${c.claim}) has resolved or is approaching resolution. miiSpine's outstanding lien balance on this matter is ${fmt(c.balance)}.

Please remit payment within 30 days, or contact our office promptly if disbursement is pending or if you wish to discuss the balance. A final itemized statement is available on request.

We appreciate your attention to closing this matter out.

Sincerely,
miiSpine Billing`,
    };
  },
  pip_inquiry(c, v) {
    return {
      subject: `${c.claim} — ${c.patient} · PIP benefits status inquiry`,
      body:
`To the PIP Claims Department:

miiSpine is a treating provider for ${c.patient} under claim ${c.claim}. We are writing to confirm the current status of PIP benefits on this claim:

  1. Total PIP benefits available and amount remaining;
  2. Whether benefits are exhausted, and if so, the exhaustion date;
  3. Any pending bills from our office awaiting adjudication.

Our records show billed charges of ${fmt(c.totalBilled)} with ${fmt(c.pipPaid)} received from PIP to date. Please provide a benefits ledger or exhaustion letter for our file.

Thank you,
miiSpine Billing`,
    };
  },
};

window.draftEmail = (id) => {
  const c = CASES.find((x) => x.id === id);
  if (!c) return;
  const btn = document.getElementById("draft-btn");
  const type = document.getElementById("draft-type")?.value || "status";
  btn.disabled = true; btn.textContent = "Drafting…";
  setTimeout(() => {
    const v = {
      attyFirst: c.atty.name.split(" ")[0],
      milestone: c.milestone ? `following the recent ${c.milestone.type.replace(/_/g, " ")}` : "as treatment progresses",
      paid: (c.pipPaid || 0) + (c.insPaid || 0),
    };
    const { subject, body } = (LETTERS[type] || LETTERS.status)(c, v);
    document.getElementById("draft-out").innerHTML = `
      <div class="email-subject"><span>Subject</span>${subject}</div>
      <div class="email-body">${body}</div>
      <button class="draft-btn" style="margin-top:8px" onclick="copyDraft(this)">Copy letter</button>`;
    btn.disabled = false; btn.textContent = "Regenerate";
  }, 400);
};

window.copyDraft = (btn) => {
  const out = document.getElementById("draft-out");
  const subject = out.querySelector(".email-subject")?.innerText.replace(/^Subject\s*/i, "") ?? "";
  const body = out.querySelector(".email-body")?.innerText ?? "";
  navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`).then(
    () => { btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = "Copy letter"), 1500); },
    () => toast("Copy failed — select the text manually"));
};

// ============================================================
// Bootstrap: demo runs immediately; live waits for Firebase to restore the
// session (onAuthStateChanged fires on load, sign-in, and sign-out).
(async () => {
  if (!CONFIGURED()) { loadData(); return; }
  try {
    const auth = await getAuth();
    auth._mod.onAuthStateChanged(auth, (u) => { fbUser = u; idToken = null; loadData(); });
  } catch (e) { loadData(); }
})();
</script>
